<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Neural quality map</title>
  <desc id="desc">A scientific light-themed anomaly map with connected nodes, waveform traces and a thermal defect focus.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edfaff"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16bde6"/><stop offset=".55" stop-color="#6a63ff"/><stop offset="1" stop-color="#ff6fb6"/></linearGradient>
    <radialGradient id="hot"><stop stop-color="#fff"/><stop offset=".18" stop-color="#fff06a"/><stop offset=".42" stop-color="#ff955a"/><stop offset=".72" stop-color="#ff5ea8" stop-opacity=".65"/><stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect x="18" y="18" width="864" height="484" rx="34" fill="url(#panel)" stroke="#c6e8f3"/>
  <g opacity=".4" stroke="#9bc7d8" stroke-width="1"><path d="M65 100H835M65 180H835M65 260H835M65 340H835M65 420H835"/><path d="M130 60V460M260 60V460M390 60V460M520 60V460M650 60V460M780 60V460"/></g>
  <path d="M70 342c46-24 74-7 111-59 35-50 76-71 116-21 37 47 61 43 95-3 44-59 78-68 118-14 41 55 82 47 123-12 47-68 95-47 151 12" fill="none" stroke="url(#trace)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 1200;1200 0" dur="2.4s" fill="freeze"/>
  </path>
  <g stroke="#82b8dd" stroke-opacity=".55" stroke-width="2">
    <path d="M151 147L277 201 390 121 507 208 626 127 754 198"/>
    <path d="M151 147L390 121M277 201L507 208M390 121L626 127M507 208L754 198"/>
    <path d="M151 147L225 300 390 121 475 316 626 127 702 320"/>
  </g>
  <g fill="#fff" stroke="#5fc9e7" stroke-width="3">
    <circle cx="151" cy="147" r="16"/><circle cx="277" cy="201" r="16"/><circle cx="390" cy="121" r="16"/><circle cx="507" cy="208" r="16"/><circle cx="626" cy="127" r="16"/><circle cx="754" cy="198" r="16"/>
    <circle cx="225" cy="300" r="13"/><circle cx="475" cy="316" r="13"/><circle cx="702" cy="320" r="13"/>
  </g>
  <circle cx="507" cy="208" r="88" fill="url(#hot)" opacity=".72" filter="url(#blur)"><animate attributeName="r" values="72;96;72" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="507" cy="208" r="52" fill="none" stroke="#ff6cae" stroke-width="3" stroke-dasharray="8 9"><animateTransform attributeName="transform" type="rotate" from="0 507 208" to="360 507 208" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="507" cy="208" r="27" fill="#ffffff" fill-opacity=".6" stroke="#ff5caa" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="68" y="78" fill="#49647a" font-size="14" font-weight="800" letter-spacing="1.7">SPATIAL ANOMALY RESPONSE</text>
    <text x="68" y="458" fill="#7390a5" font-size="12" font-weight="700">PatchCore embedding map · defect focus · feature-space signal</text>
    <rect x="650" y="67" width="172" height="42" rx="21" fill="#fff" stroke="#bce7f2"/>
    <circle cx="677" cy="88" r="7" fill="#22c55e"><animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="695" y="93" fill="#4f657a" font-size="12" font-weight="800">SIGNAL LOCKED</text>
  </g>
</svg>
