<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Industrial AI product inspection line</title>
  <desc id="desc">A restrained industrial illustration showing a camera inspecting manufactured products on a conveyor.</desc>
  <defs>
