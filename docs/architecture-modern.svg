<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">FactoryVision AI architecture</title><desc id="desc">Industrial visual inspection pipeline from image ingestion through PatchCore inference, FastAPI services, persistence, dashboard and grounded copilot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker><style>.card{fill:#fff;stroke:#dbe7f5;stroke-width:1.5;rx:18;filter:url(#shadow)}.title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:500 14px Inter,Arial,sans-serif;fill:#64748b}.h{font:700 18px Inter,Arial,sans-serif;fill:#0f172a}.p{font:500 13px Inter,Arial,sans-serif;fill:#64748b}.tag{font:700 11px Inter,Arial,sans-serif;fill:#2563eb}.a{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1400" height="520" rx="26" fill="url(#bg)"/><text class="title" x="70" y="62">FactoryVision AI · Production Inspection Flow</text><text class="sub" x="70" y="90">Computer vision · explainability · API · analytics · grounded AI assistance</text><rect x="70" y="150" width="205" height="170" class="card"/><rect x="92" y="174" width="68" height="28" rx="14" fill="#dbeafe"/><text class="tag" x="126" y="193" text-anchor="middle">INPUT</text><text class="h" x="92" y="235">Industrial Image</text><text class="p" x="92" y="263">Camera / upload</text><text class="p" x="92" y="286">Quality sample</text><rect x="325" y="150" width="220" height="170" class="card"/><rect x="347" y="174" width="78" height="28" rx="14" fill="#dcfce7"/><text class="tag" x="386" y="193" text-anchor="middle" fill="#059669">MODEL</text><text class="h" x="347" y="235">PatchCore</text><text class="p" x="347" y="263">Anomaly score</text><text class="p" x="347" y="286">Heatmap + localization</text><rect x="595" y="150" width="210" height="170" class="card"/><rect x="617" y="174" width="70" height="28" rx="14" fill="#ede9fe"/><text class="tag" x="652" y="193" text-anchor="middle">API</text><text class="h" x="617" y="235">FastAPI</text><text class="p" x="617" y="263">Validated inference</text><text class="p" x="617" y="286">Health + inspection API</text><rect x="855" y="105" width="215" height="140" class="card"/><text class="h" x="877" y="150">Inspection Store</text><text class="p" x="877" y="178">History · KPIs</text><text class="p" x="877" y="201">Evidence persistence</text><rect x="855" y="285" width="215" height="140" class="card"/><text class="h" x="877" y="330">React Dashboard</text><text class="p" x="877" y="358">Upload · score</text><text class="p" x="877" y="381">Heatmap · trend view</text><rect x="1120" y="195" width="220" height="150" class="card"/><rect x="1142" y="219" width="96" height="28" rx="14" fill="#cffafe"/><text class="tag" x="1190" y="238" text-anchor="middle">COPILOT</text><text class="h" x="1142" y="282">Grounded Quality AI</text><text class="p" x="1142" y="310">Explains recorded evidence</text><path class="a" d="M275 235 H325"/><path class="a" d="M545 235 H595"/><path class="a" d="M805 220 C830 220 830 175 855 175"/><path class="a" d="M805 250 C830 250 830 355 855 355"/><path class="a" d="M1070 175 C1100 175 1090 245 1120 255"/><path class="a" d="M1070 355 C1100 355 1090 300 1120 290"/><rect x="70" y="455" width="1270" height="2" fill="#dbe7f5"/><circle cx="82" cy="479" r="5" fill="#2563eb"/><text class="sub" x="98" y="484">Separation of concerns keeps model inference deterministic and AI explanations grounded in inspection evidence.</text></svg>