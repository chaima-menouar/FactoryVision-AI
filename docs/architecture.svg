<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="390" viewBox="0 0 1220 390" role="img" aria-labelledby="title desc"><title id="title">FactoryVision AI architecture</title><desc id="desc">Industrial images are processed by PatchCore, exposed through FastAPI, persisted for analytics, visualized in React, and summarized for a grounded quality copilot with a future Azure deployment path.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="20" y="145" width="165" height="90"/><text class="t" x="102" y="180" text-anchor="middle">Industrial Image</text><text class="s" x="102" y="208" text-anchor="middle">camera / upload</text><rect class="b" x="230" y="145" width="180" height="90"/><text class="t" x="320" y="180" text-anchor="middle">PatchCore</text><text class="s" x="320" y="208" text-anchor="middle">score + localization</text><rect class="b" x="455" y="145" width="170" height="90"/><text class="t" x="540" y="180" text-anchor="middle">FastAPI</text><text class="s" x="540" y="208" text-anchor="middle">real inference</text><rect class="b" x="675" y="55" width="180" height="90"/><text class="t" x="765" y="90" text-anchor="middle">SQLite History</text><text class="s" x="765" y="118" text-anchor="middle">inspections + KPIs</text><rect class="b" x="675" y="235" width="180" height="90"/><text class="t" x="765" y="270" text-anchor="middle">React Dashboard</text><text class="s" x="765" y="298" text-anchor="middle">upload + heatmaps</text><rect class="b" x="925" y="145" width="180" height="90"/><text class="t" x="1015" y="180" text-anchor="middle">Quality Copilot</text><text class="s" x="1015" y="208" text-anchor="middle">grounded context</text><path class="a" d="M185 190 H230"/><path class="a" d="M410 190 H455"/><path class="a" d="M625 175 C650 175 650 100 675 100"/><path class="a" d="M625 205 C650 205 650 280 675 280"/><path class="a" d="M855 100 C900 100 895 165 925 175"/><path class="a" d="M855 280 C900 280 895 215 925 205"/></svg>