name: Build Azure Runtime Image

on:
  workflow_dispatch:
    inputs:
      model_release_url:
        description: Public URL of the verified FactoryVision model release ZIP
        required: true
        type: string
      image_tag:
        description: Container image tag
        required: true
        default: azure-demo
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified model release
        env:
          MODEL_RELEASE_URL: ${{ inputs.model_release_url }}
        run: |
          curl --fail --location --retry 3 "$MODEL_RELEASE_URL" --output /tmp/factoryvision-model.zip

      - name: Verify and install model release
        run: |
          python scripts/install_model_release.py \
            --archive /tmp/factoryvision-model.zip \
            --destination build_artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push public runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/factoryvision-ai:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=FactoryVision AI Azure runtime
